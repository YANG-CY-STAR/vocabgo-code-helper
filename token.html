<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>词达人 · 取 token 助手</title>
<style>
  :root{--bg:#f6f3ec;--card:#fff;--ink:#1f1c16;--sub:#7a7264;--line:#e7e0d3;--accent:#c8522f;--accent2:#1f6f4a;--warn:#b45309}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;padding:20px 16px 40px;background:var(--bg);color:var(--ink);
       font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;line-height:1.65;font-size:16px}
  .wrap{max-width:560px;margin:0 auto}
  h1{font-size:22px;margin:0 0 6px}
  .sub{color:var(--sub);font-size:13.5px;margin:0 0 20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
  .step{display:flex;gap:10px;align-items:flex-start;margin:0 0 14px}
  .step:last-child{margin-bottom:0}
  .num{flex:0 0 24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;margin-top:2px}
  .step h3{margin:0 0 2px;font-size:15.5px;font-weight:600}
  .step p{margin:0;color:var(--sub);font-size:14px}
  .btn{display:block;width:100%;padding:15px;border:0;border-radius:12px;font-size:16.5px;font-weight:600;color:#fff;background:var(--accent);cursor:pointer;margin:4px 0 0;font-family:inherit}
  .btn:active{opacity:.85}
  .btn:disabled{opacity:.5}
  .btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
  textarea{width:100%;min-height:84px;padding:12px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;
           font-family:ui-monospace,Menlo,monospace;resize:vertical;background:#fdfcf9;color:var(--ink)}
  textarea:focus{outline:none;border-color:var(--accent)}
  .hint{font-size:12.5px;color:var(--sub);margin:8px 0 0}
  .out{font-family:ui-monospace,Menlo,monospace;font-size:14px;background:#f2efe8;padding:10px 12px;border-radius:8px;
       word-break:break-all;display:none;margin:10px 0 0;white-space:pre-wrap}
  .timer{display:none;margin:10px 0 0;font-size:13.5px;color:var(--warn);font-weight:600}
  .ok{color:var(--accent2);font-weight:600}
  .warn{background:#fff8ee;border-color:#f3d9b5}
  .warn .num{background:var(--warn)}
  footer{margin-top:22px;color:var(--sub);font-size:12.5px;text-align:center;line-height:1.7}
  .tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:#efe9dd;color:var(--sub);margin-left:6px;vertical-align:2px}
  .row{display:flex;gap:8px;margin-top:10px}
  .row .btn{margin:0}
</style>
</head>
<body>
<div class="wrap">

  <h1>词达人 · 取 token 助手</h1>
  <p class="sub">授权一次 → 拿到链接 → 自动换取 token。全程在你的浏览器里完成，不经过任何第三方服务器。</p>

  <div class="card">
    <div class="step">
      <div class="num">1</div>
      <div><h3>开始授权</h3><p>跳转微信授权页，点「允许」。</p></div>
    </div>
    <button class="btn" id="go">开始授权 →</button>
  </div>

  <div class="card warn">
    <div class="step">
      <div class="num">2</div>
      <div><h3>看到「404 Not Found」是正常的 <span class="tag">关键</span></h3>
      <p>这个页面没有脚本，所以 code 不会被用掉，会留在网址里。</p></div>
    </div>
    <div class="step">
      <div class="num">3</div>
      <div><h3>点右上角 … → 复制链接</h3><p>不用开飞行模式、不用关微信。</p></div>
    </div>
  </div>

  <div class="card">
    <div class="step">
      <div class="num">4</div>
      <div><h3>粘贴链接，自动换 token</h3><p>页面会用 ECDH + AES-GCM 完成它的登录协议。</p></div>
    </div>
    <textarea id="paste" placeholder="粘贴刚才复制的链接，例如：&#10;https://app.vocabgo.com/student/_cb?code=071xxx&state=1"></textarea>
    <button class="btn" id="exchange" style="margin-top:10px">提取 code 并换 token</button>
    <div class="timer" id="timer"></div>
    <div class="out" id="out"></div>
    <div class="row" id="actions" style="display:none">
      <button class="btn ghost" id="copyToken">复制 token</button>
      <button class="btn ghost" id="checkUser">验证账号</button>
    </div>
    <p class="hint" id="msg">code 只能用一次，有效期约 5 分钟。</p>
  </div>

  <footer>
    纯前端 · 不上传、不存储 · 数据只留在你的设备上
  </footer>
</div>

<script>
(function () {
  "use strict";

  var APPID = "wx2a694105a6abbe6d";
  var REDIRECT = "https://app.vocabgo.com/student/_cb";
  var AUTH_URL = "https://open.weixin.qq.com/connect/oauth2/authorize?appid=" + APPID
    + "&redirect_uri=" + encodeURIComponent(REDIRECT)
    + "&response_type=code&scope=snsapi_userinfo&state=1&connect_redirect=1#wechat_redirect";

  var API = "https://app.vocabgo.com/student/api";
  var SALT = "ajfajfamsnfaflfasakljdlalkflak";
  var VERSION = "2.7.0.261109_01";
  var HKDF_INFO = "vcg-auth-aes";

  var $ = function (id) { return document.getElementById(id); };

  // ---------- MD5（紧凑实现，公有领域算法）----------
  var md5 = (function () {
    function safeAdd(x, y) { var lsw = (x & 0xFFFF) + (y & 0xFFFF); var msw = (x >> 16) + (y >> 16) + (lsw >> 16); return (msw << 16) | (lsw & 0xFFFF); }
    function bitRotateLeft(num, cnt) { return (num << cnt) | (num >>> (32 - cnt)); }
    function md5cmn(q, a, b, x, s, t) { return safeAdd(bitRotateLeft(safeAdd(safeAdd(a, q), safeAdd(x, t)), s), b); }
    function md5ff(a, b, c, d, x, s, t) { return md5cmn((b & c) | (~b & d), a, b, x, s, t); }
    function md5gg(a, b, c, d, x, s, t) { return md5cmn((b & d) | (c & ~d), a, b, x, s, t); }
    function md5hh(a, b, c, d, x, s, t) { return md5cmn(b ^ c ^ d, a, b, x, s, t); }
    function md5ii(a, b, c, d, x, s, t) { return md5cmn(c ^ (b | ~d), a, b, x, s, t); }
    function binlMD5(x, len) {
      x[len >> 5] |= 0x80 << (len % 32);
      x[(((len + 64) >>> 9) << 4) + 14] = len;
      var a = 1732584193, b = -271733879, c = -1732584194, d = 271733878;
      for (var i = 0; i < x.length; i += 16) {
        var olda = a, oldb = b, oldc = c, oldd = d;
        a = md5ff(a, b, c, d, x[i], 7, -680876936); d = md5ff(d, a, b, c, x[i + 1], 12, -389564586);
        c = md5ff(c, d, a, b, x[i + 2], 17, 606105819); b = md5ff(b, c, d, a, x[i + 3], 22, -1044525330);
        a = md5ff(a, b, c, d, x[i + 4], 7, -176418897); d = md5ff(d, a, b, c, x[i + 5], 12, 1200080426);
        c = md5ff(c, d, a, b, x[i + 6], 17, -1473231341); b = md5ff(b, c, d, a, x[i + 7], 22, -45705983);
        a = md5ff(a, b, c, d, x[i + 8], 7, 1770035416); d = md5ff(d, a, b, c, x[i + 9], 12, -1958414417);
        c = md5ff(c, d, a, b, x[i + 10], 17, -42063); b = md5ff(b, c, d, a, x[i + 11], 22, -1990404162);
        a = md5ff(a, b, c, d, x[i + 12], 7, 1804603682); d = md5ff(d, a, b, c, x[i + 13], 12, -40341101);
        c = md5ff(c, d, a, b, x[i + 14], 17, -1502002290); b = md5ff(b, c, d, a, x[i + 15], 22, 1236535329);
        a = md5gg(a, b, c, d, x[i + 1], 5, -165796510); d = md5gg(d, a, b, c, x[i + 6], 9, -1069501632);
        c = md5gg(c, d, a, b, x[i + 11], 14, 643717713); b = md5gg(b, c, d, a, x[i], 20, -373897302);
        a = md5gg(a, b, c, d, x[i + 5], 5, -701558691); d = md5gg(d, a, b, c, x[i + 10], 9, 38016083);
        c = md5gg(c, d, a, b, x[i + 15], 14, -660478335); b = md5gg(b, c, d, a, x[i + 4], 20, -405537848);
        a = md5gg(a, b, c, d, x[i + 9], 5, 568446438); d = md5gg(d, a, b, c, x[i + 14], 9, -1019803690);
        c = md5gg(c, d, a, b, x[i + 3], 14, -187363961); b = md5gg(b, c, d, a, x[i + 8], 20, 1163531501);
        a = md5gg(a, b, c, d, x[i + 13], 5, -1444681467); d = md5gg(d, a, b, c, x[i + 2], 9, -51403784);
        c = md5gg(c, d, a, b, x[i + 7], 14, 1735328473); b = md5gg(b, c, d, a, x[i + 12], 20, -1926607734);
        a = md5hh(a, b, c, d, x[i + 5], 4, -378558); d = md5hh(d, a, b, c, x[i + 8], 11, -2022574463);
        c = md5hh(c, d, a, b, x[i + 11], 16, 1839030562); b = md5hh(b, c, d, a, x[i + 14], 23, -35309556);
        a = md5hh(a, b, c, d, x[i + 1], 4, -1530992060); d = md5hh(d, a, b, c, x[i + 4], 11, 1272893353);
        c = md5hh(c, d, a, b, x[i + 7], 16, -155497632); b = md5hh(b, c, d, a, x[i + 10], 23, -1094730640);
        a = md5hh(a, b, c, d, x[i + 13], 4, 681279174); d = md5hh(d, a, b, c, x[i], 11, -358537222);
        c = md5hh(c, d, a, b, x[i + 3], 16, -722521979); b = md5hh(b, c, d, a, x[i + 6], 23, 76029189);
        a = md5hh(a, b, c, d, x[i + 9], 4, -640364487); d = md5hh(d, a, b, c, x[i + 12], 11, -421815835);
        c = md5hh(c, d, a, b, x[i + 15], 16, 530742520); b = md5hh(b, c, d, a, x[i + 2], 23, -995338651);
        a = md5ii(a, b, c, d, x[i], 6, -198630844); d = md5ii(d, a, b, c, x[i + 7], 10, 1126891415);
        c = md5ii(c, d, a, b, x[i + 14], 15, -1416354905); b = md5ii(b, c, d, a, x[i + 5], 21, -57434055);
        a = md5ii(a, b, c, d, x[i + 12], 6, 1700485571); d = md5ii(d, a, b, c, x[i + 3], 10, -1894986606);
        c = md5ii(c, d, a, b, x[i + 10], 15, -1051523); b = md5ii(b, c, d, a, x[i + 1], 21, -2054922799);
        a = md5ii(a, b, c, d, x[i + 8], 6, 1873313359); d = md5ii(d, a, b, c, x[i + 15], 10, -30611744);
        c = md5ii(c, d, a, b, x[i + 6], 15, -1560198380); b = md5ii(b, c, d, a, x[i + 13], 21, 1309151649);
        a = md5ii(a, b, c, d, x[i + 4], 6, -145523070); d = md5ii(d, a, b, c, x[i + 11], 10, -1120210379);
        c = md5ii(c, d, a, b, x[i + 2], 15, 718787259); b = md5ii(b, c, d, a, x[i + 9], 21, -343485551);
        a = safeAdd(a, olda); b = safeAdd(b, oldb); c = safeAdd(c, oldc); d = safeAdd(d, oldd);
      }
      return [a, b, c, d];
    }
    function binl2rstr(input) {
      var output = "", length32 = input.length * 32;
      for (var i = 0; i < length32; i += 8) output += String.fromCharCode((input[i >> 5] >>> (i % 32)) & 0xFF);
      return output;
    }
    function rstr2binl(input) {
      var output = [], i;
      output[(input.length >> 2) - 1] = undefined;
      for (i = 0; i < output.length; i += 1) output[i] = 0;
      var length8 = input.length * 8;
      for (i = 0; i < length8; i += 8) output[i >> 5] |= (input.charCodeAt(i / 8) & 0xFF) << (i % 32);
      return output;
    }
    function rstrMD5(s) { return binl2rstr(binlMD5(rstr2binl(s), s.length * 8)); }
    function rstr2hex(input) {
      var hexTab = "0123456789abcdef", output = "", x, i;
      for (i = 0; i < input.length; i += 1) { x = input.charCodeAt(i); output += hexTab.charAt((x >>> 4) & 0x0F) + hexTab.charAt(x & 0x0F); }
      return output;
    }
    function str2rstrUTF8(input) { return unescape(encodeURIComponent(input)); }
    return function (s) { return rstr2hex(rstrMD5(str2rstrUTF8(s))); };
  })();

  // ---------- 工具 ----------
  function b64FromBuf(buf) {
    var bytes = new Uint8Array(buf), bin = "";
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }
  function bufFromB64(s) {
    var bin = atob(s), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function makeSign(obj) {
    var keys = Object.keys(obj).filter(function (k) {
      var v = obj[k];
      return v !== undefined && v !== null && v !== "";
    }).sort();
    var raw = keys.map(function (k) { return k + "=" + obj[k]; }).join("&") + SALT;
    return md5(raw);
  }
  function extractCode(text) {
    text = (text || "").trim();
    if (!text) return "";
    var m = text.match(/[?&#]code=([^&#\s]+)/i);
    if (m) return decodeURIComponent(m[1]);
    if (/^[A-Za-z0-9_\-]{20,}$/.test(text)) return text;
    return "";
  }

  // ---------- 核心：用 code 换 token ----------
  async function exchange(code) {
    var subtle = window.crypto && window.crypto.subtle;
    if (!subtle) throw new Error("当前环境不支持 WebCrypto（需要 https 或 localhost）");

    // 1. 生成 ECDH 密钥
    var kp = await subtle.generateKey({ name: "ECDH", namedCurve: "P-256" }, true, ["deriveBits"]);
    var spki = await subtle.exportKey("spki", kp.publicKey);
    var cpubK = b64FromBuf(spki);

    // 2. 登录请求
    var body = { code: code, cpub_k: cpubK, cpub_v: "v1", timestamp: Date.now(), version: VERSION, app_type: 1 };
    body.sign = makeSign(body);

    var resp = await fetch(API + "/Auth/Wechat/V2/LoginByWechatCode", {
      method: "POST",
      headers: {
        "Content-Type": "application/json;charset=UTF-8",
        "X-Requested-With": "XMLHttpRequest",
        "Referer": "https://app.vocabgo.com/student/",
        "Origin": "https://app.vocabgo.com",
      },
      body: JSON.stringify(body),
    });
    var json = await resp.json();
    if (json.code !== 1) throw new Error(json.msg || ("接口返回 code=" + json.code));

    // 3. 解析信封
    var data = json.data || {};
    var env = (data.encrypted && data.payload) ? data.payload : data;
    var serverPub = data.spub_k || data.serverPublicKey || env.spub_k;
    var salt = data.salt || env.salt;
    if (!serverPub || !salt || !env.iv || !env.cipher_text) {
      throw new Error("信封字段不全：" + JSON.stringify(Object.keys(data)));
    }

    // 4. ECDH -> HKDF -> AES-GCM 解密
    var serverKey = await subtle.importKey("spki", bufFromB64(serverPub), { name: "ECDH", namedCurve: "P-256" }, true, []);
    var shared = await subtle.deriveBits({ name: "ECDH", public: serverKey }, kp.privateKey, 256);
    var hkdfKey = await subtle.importKey("raw", shared, "HKDF", false, ["deriveBits"]);
    var aesBits = await subtle.deriveBits(
      { name: "HKDF", hash: "SHA-256", salt: bufFromB64(salt), info: new TextEncoder().encode(HKDF_INFO) },
      hkdfKey, 256
    );
    var aesKey = await subtle.importKey("raw", aesBits, { name: "AES-GCM" }, false, ["decrypt"]);
    var plainBuf = await subtle.decrypt(
      { name: "AES-GCM", iv: bufFromB64(env.iv), additionalData: env.aad ? new TextEncoder().encode(env.aad) : undefined, tagLength: 128 },
      aesKey, bufFromB64(env.cipher_text)
    );
    var text = new TextDecoder().decode(plainBuf);
    var payload;
    try { payload = JSON.parse(text); } catch (e) { payload = { raw: text }; }
    return payload;
  }

  async function callApiWithToken(token, path, body) {
    var b = Object.assign({}, body || {}, { timestamp: Date.now(), version: VERSION, app_type: 1 });
    b.sign = makeSign(b);
    var res = await fetch(API + path, {
      method: "POST",
      headers: {
        "Content-Type": "application/json;charset=UTF-8",
        "X-Requested-With": "XMLHttpRequest",
        "UserToken": token,
        "Referer": "https://app.vocabgo.com/student/",
      },
      body: JSON.stringify(b),
    });
    return res.json();
  }

  // ---------- UI ----------
  var out = $("out"), timerEl = $("timer"), msgEl = $("msg"), actions = $("actions");
  var currentToken = "", timerId = 0;

  $("go").addEventListener("click", function () {
    if (!/MicroMessenger/i.test(navigator.userAgent || "")) {
      msgEl.textContent = "提示：这条链接需要在微信里打开，否则微信会拒绝授权。";
    }
    window.location.href = AUTH_URL;
  });

  function startTimer(seconds) {
    clearInterval(timerId);
    var left = seconds;
    timerEl.style.display = "block";
    (function tick() {
      if (left <= 0) { timerEl.textContent = "⚠️ 已超 5 分钟，code 可能失效，请重新授权。"; return; }
      var m = Math.floor(left / 60), s2 = left % 60;
      timerEl.textContent = "⏳ code 剩余约 " + m + " 分 " + (s2 < 10 ? "0" + s2 : s2) + " 秒有效";
      left--; timerId = setTimeout(tick, 1000);
    })();
  }

  $("exchange").addEventListener("click", async function () {
    var code = extractCode($("paste").value);
    if (!code) {
      out.style.display = "block";
      out.textContent = "没找到 code。请粘贴带 code= 的完整链接。";
      actions.style.display = "none";
      return;
    }
    out.style.display = "block";
    out.textContent = "⏳ 正在换取 token…";
    $("exchange").disabled = true;
    startTimer(300);
    try {
      var payload = await exchange(code);
      var token = payload.token || payload.access_token || "";
      if (!token) {
        out.textContent = "⚠️ 拿到响应但没有 token 字段：\n" + JSON.stringify(payload).slice(0, 600);
        return;
      }
      currentToken = token;
      out.textContent = "✅ 换取成功\n\ntoken: " + token + "\n\n" + JSON.stringify(payload, null, 1).slice(0, 500);
      actions.style.display = "flex";
      msgEl.textContent = "token 已就绪。点「验证账号」可以确认它属于谁。";
    } catch (e) {
      out.textContent = "❌ 失败：" + (e && e.message ? e.message : e) + "\n\n常见原因：code 已过期或被用过，重新授权一次即可。";
    } finally {
      $("exchange").disabled = false;
    }
  });

  $("copyToken").addEventListener("click", function () {
    if (!currentToken) return;
    var ta = document.createElement("textarea");
    ta.value = currentToken; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
    this.textContent = "已复制 ✓";
    var btn = this;
    setTimeout(function () { btn.textContent = "复制 token"; }, 1600);
  });

  $("checkUser").addEventListener("click", async function () {
    if (!currentToken) return;
    out.textContent = "⏳ 查询中…";
    try {
      var r = await callApiWithToken(currentToken, "/Student/Main", {});
      var u = (r.data || {}).user_info || {};
      out.textContent = "✅ 验证成功\n\n姓名：" + (u.student_name || "-") + "\n学号：" + (u.student_code || "-") + "\n昵称：" + (u.nick_name || "-") + "\n\n接口返回 code=" + r.code;
    } catch (e) {
      out.textContent = "❌ 查询失败：" + e.message;
    }
  });
})();
</script>
</body>
</html>
