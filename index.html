<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Code 提取</title>
<style>
  :root{--bg:#f6f6f8;--card:#fff;--line:#e6e7eb;--ink:#17181c;--sub:#6f7686;--accent:#d9482f;--ok:#1a7f4b;--warn:#9a6a12}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;padding:24px 16px 40px;background:var(--bg);color:var(--ink);
       font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
       line-height:1.6;font-size:15px;display:flex;justify-content:center}
  .wrap{width:100%;max-width:440px}
  h1{font-size:18px;font-weight:600;margin:0 0 18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
  .btn{display:block;width:100%;padding:14px;border:0;border-radius:10px;font-size:15.5px;font-weight:600;
       color:#fff;background:var(--accent);cursor:pointer;font-family:inherit;letter-spacing:.3px}
  .btn:active{opacity:.85}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  textarea{width:100%;min-height:76px;padding:11px;border:1px solid var(--line);border-radius:10px;
           font-size:13px;font-family:ui-monospace,Menlo,monospace;background:#fbfbfc;color:var(--ink);
           resize:vertical;margin:0 0 10px}
  textarea::placeholder{color:#a3a8b4}
  textarea:focus{outline:none;border-color:var(--accent)}
  .tip{margin:10px 0 0;color:var(--sub);font-size:12.5px;display:flex;gap:6px;align-items:flex-start}
  .tip .dot{flex:0 0 16px;height:16px;border-radius:50%;background:#fff3e8;color:#b45309;font-size:11px;
            display:flex;align-items:center;justify-content:center;margin-top:2px}
  .out{font-family:ui-monospace,Menlo,monospace;font-size:14px;background:#fbfbfc;border:1px solid var(--line);
       border-radius:10px;padding:11px;word-break:break-all;white-space:pre-wrap;display:none;margin:10px 0 0}
  .out.ok{border-color:#bfe3cf;background:#f2faf5;color:var(--ok)}
  .out.err{border-color:#f0cfc8;background:#fdf4f2;color:#b23c22}
  .row{display:flex;gap:8px;margin-top:10px}
  .row .btn{margin:0}
  .qr{text-align:center}
  .qr img{width:140px;height:140px;border-radius:10px;border:1px solid var(--line);padding:6px;background:#fff}
</style>
</head>
<body>
<div class="wrap">

  <h1>Code 提取</h1>

  <div class="card">
    <button class="btn" id="go">微信授权</button>
    <div class="tip">
      <span class="dot">!</span>
      <span>显示 404 时点右上角 <b>…</b> 复制链接</span>
    </div>
  </div>

  <div class="card">
    <textarea id="paste" placeholder="粘贴链接"></textarea>
    <button class="btn" id="extract">提取 Code</button>
    <div class="out" id="out"></div>
    <div class="row" id="actions" style="display:none">
      <button class="btn ghost" id="copyCode">复制</button>
    </div>
  </div>

</div>

<script>
(function () {
  "use strict";

  var APPID = "wx2a694105a6abbe6d";
  var REDIRECT = "https://app.vocabgo.com/student/_cb";
  var AUTH_URL = "https://open.weixin.qq.com/connect/oauth2/authorize?appid=" + APPID
    + "&redirect_uri=" + encodeURIComponent(REDIRECT)
    + "&response_type=code&scope=snsapi_userinfo&state=1&connect_redirect=1#wechat_redirect";

  var $ = function (id) { return document.getElementById(id); };
  var current = "";

  function extractCode(text) {
    text = (text || "").trim();
    if (!text) return "";
    var m = text.match(/[?&#]code=([^&#\s]+)/i);
    if (m) return decodeURIComponent(m[1]);
    if (/^[A-Za-z0-9_\-]{20,}$/.test(text)) return text;
    return "";
  }

  $("go").addEventListener("click", function () {
    window.location.href = AUTH_URL;
  });

  $("extract").addEventListener("click", function () {
    var out = $("out");
    var code = extractCode($("paste").value);
    if (!code) {
      out.className = "out err";
      out.style.display = "block";
      out.textContent = "未找到 code";
      $("actions").style.display = "none";
      return;
    }
    current = code;
    out.className = "out ok";
    out.style.display = "block";
    out.textContent = code;
    $("actions").style.display = "flex";
  });

  $("copyCode").addEventListener("click", function () {
    if (!current) return;
    var btn = this;
    var ta = document.createElement("textarea");
    ta.value = current;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
    btn.textContent = "已复制 ✓";
    setTimeout(function () { btn.textContent = "复制"; }, 1500);
  });
})();
</script>
</body>
</html>
