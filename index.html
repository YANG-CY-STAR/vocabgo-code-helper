<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>授权助手</title>
<style>
  :root{--bg:#f6f6f8;--card:#fff;--line:#e6e7eb;--ink:#17181c;--sub:#6f7686;--accent:#d9482f;--ok:#1a7f4b;--warn:#9a6a12;--chip:#f1f2f5}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;padding:20px 14px 36px;background:var(--bg);color:var(--ink);
       font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
       line-height:1.6;font-size:15px;display:flex;justify-content:center}
  .wrap{width:100%;max-width:440px}
  h1{font-size:18px;font-weight:600;margin:0 0 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
  .btn{display:block;width:100%;padding:14px;border:0;border-radius:10px;font-size:15.5px;font-weight:600;
       color:#fff;background:var(--accent);cursor:pointer;font-family:inherit}
  .btn:active{opacity:.85}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn:disabled{opacity:.5}
  textarea{width:100%;min-height:74px;padding:11px;border:1px solid var(--line);border-radius:10px;
           font-size:13px;font-family:ui-monospace,Menlo,monospace;background:#fbfbfc;color:var(--ink);
           resize:vertical;margin:0 0 10px}
  textarea::placeholder{color:#a3a8b4}
  textarea:focus{outline:none;border-color:var(--accent)}
  .tip{margin:10px 0 0;color:var(--sub);font-size:12.5px;display:flex;gap:7px;align-items:flex-start}
  .tip .dot{flex:0 0 17px;height:17px;border-radius:50%;background:#fff3e8;color:#b45309;font-size:11px;
            display:flex;align-items:center;justify-content:center;margin-top:2px;font-weight:600}
  .out{font-family:ui-monospace,Menlo,monospace;font-size:14px;background:#fbfbfc;border:1px solid var(--line);
       border-radius:10px;padding:11px;word-break:break-all;white-space:pre-wrap;display:none;margin:10px 0 0}
  .out.ok{border-color:#bfe3cf;background:#f2faf5;color:var(--ok)}
  .out.err{border-color:#f0cfc8;background:#fdf4f2;color:#b23c22;font-size:13px;line-height:1.55}
  .row{display:flex;gap:8px;margin-top:10px}
  .row .btn{margin:0}
  .modes{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
  .mode{border:1px solid var(--line);background:#fff;color:var(--sub);padding:6px 11px;border-radius:999px;
        font-size:12.5px;cursor:pointer;font-family:inherit}
  .mode.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .modes-label{font-size:12px;color:var(--sub);margin:12px 0 0}
</style>
</head>
<body>
<div class="wrap">

  <h1>授权助手</h1>

  <div class="card">
    <button class="btn" id="go">微信授权</button>
    <p class="modes-label">落地方式（不成功可换一个）</p>
    <div class="modes" id="modes"></div>
    <div class="tip">
      <span class="dot">1</span>
      <span>授权后出现<b>白屏或一段代码</b>，属正常</span>
    </div>
    <div class="tip">
      <span class="dot">2</span>
      <span>点 <b>…</b> → <b>在浏览器打开</b>，或直接复制链接</span>
    </div>
    <div class="tip">
      <span class="dot">3</span>
      <span>拿到链接粘到下面，点提取</span>
    </div>
  </div>

  <div class="card">
    <textarea id="paste" placeholder="粘贴授权后的链接"></textarea>
    <div class="row" style="margin:0 0 10px">
      <button class="btn ghost" id="readClip">从剪贴板读取</button>
      <button class="btn" id="extract" style="flex:1">提取 Code</button>
    </div>
    <div class="out" id="out"></div>
    <div class="row" id="actions" style="display:none">
      <button class="btn ghost" id="copyCode">复制 Code</button>
    </div>
  </div>

</div>
